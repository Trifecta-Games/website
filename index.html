<!-- Contact Section -->
<section id="contact" class="py-20 px-4 md:px-8 bg-gray-800">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row gap-12">
            <div class="md:w-1/2">
                <h2 class="text-3xl md:text-4xl font-bold mb-6">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
                        Get In Touch
                    </span>
                </h2>
                <p class="text-lg mb-8 text-gray-300">
                    Have a project in mind? Want to learn more about our services?
                    Drop us a message and we'll get back to you soon.
                </p>

                <div class="space-y-4">
                    <div class="flex items-center">
                        <i data-feather="mail" class="w-6 h-6 mr-4 text-primary"></i>
                        <span>info@trifectastudios.io</span>
                    </div>
                    <div class="flex items-center">
                        <i data-feather="phone" class="w-6 h-6 mr-4 text-primary"></i>
                        <span>+880 1860-066074</span>
                    </div>
                    <div class="flex items-center">
                        <i data-feather="map-pin" class="w-6 h-6 mr-4 text-primary"></i>
                        <span>130-131 Tejkunipara Rd,Tejgaon, Dhaka, Bangladesh</span>
                    </div>
                </div>
            </div>

            <div class="md:w-1/2">
                <form id="form" class="space-y-6">

                    <div>
                        <label for="name" class="block mb-2">Name</label>
                        <input type="text" id="name" name="name"
                            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <div>
                        <label for="email" class="block mb-2">Email</label>
                        <input type="email" id="email" name="email"
                            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <div>
                        <label for="message" class="block mb-2">Message</label>
                        <textarea id="message" name="message" rows="4"
                            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-lg font-semibold hover:from-purple-700 hover:to-pink-700 transition-all transform hover:scale-105 shadow-lg">
                        Send Message
                    </button>

                </form>
            </div>
        </div>
    </div>
</section>
